<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password – Just Buket</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Lemon&display=swap" rel="stylesheet">
  <style>
    body {
      background: url(../images/flight.jpg) no-repeat center center fixed;
      background-size: cover;
      font-family: 'DM Serif Display', serif;
      padding: 40px;
    }

    .forgot-container {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #b32f4a;
      font-family: 'Lemon', serif;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.7em;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 0.8em;
      background-color: #b32f4a;
      color: white;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #8c2038;
    }
  </style>
</head>
<body>
  <div class="forgot-container">
    <h2>Forgot Password</h2>
    <form method="POST" action="/forgot-password">
      <label>Email Address</label>
      <input type="email" name="email" required />
      <button type="submit">Send Reset Link</button>
    </form>
  </div>
</body>
</html>
