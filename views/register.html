<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - TicketGate</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Lemon&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ffe5ec;
      --skin: #fff6f2;
      --cherry: #9f1d3c;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'DM Serif Display', serif;
      background: url('../images/firstview.jpg') center/cover no-repeat fixed;
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .register-box {
      background: rgba(138, 198, 227, 0.98);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(221, 182, 191, 0.717);
      max-width: 450px;
      width: 100%;
    }

    h1 {
      font-family: 'Lemon', serif;
      color: var(--cherry);
      text-align: center;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--cherry);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Lemon', serif;
    }

    button:hover {
      background-color: #79142e;
    }

    p {
      text-align: center;
      margin-top: 1rem;
    }

    a {
      color: var(--cherry);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="register-box">
    <h1>Register</h1>
    <form method="POST" action="/register">
      <label>Username:</label>
      <input type="text" name="username" required />

      <label>Email:</label>
      <input type="email" name="email" required />

      <label>Password:</label>
      <input type="password" name="password" required />

      <label>Role:</label>
      <select name="role" required>
        <option value="user">User</option>
        <option value="vendor">Vendor</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/views/login.html">Login here</a></p>
  </div>
  <script src="../public/scripts/main.js"></script>
</body>
</html>
